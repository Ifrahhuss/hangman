<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src="words.js" defer></script>
</head>
<body>
    <div class ="container">
        <div class = "hangman-box">
            <img src="assets/h-0.jpg" alt="hangman-img00">
            <h1>Hangman</h1>
        </div>
        <div class="game-box">
            <ul class ="word-display">
                <li class="letter"></li>
                <li class="letter"></li>
                <li class="letter">a</li>
                <li class="letter"></li>
                <li class="letter"></li>
                <li class="letter"></li>
            </ul>
            <h4 class="hint-text">
                Hint: something
            </h4>
            <h4 class ="guesses-text">
                Incorrect guesses:
                <b>0/6</b>
            </h4>
            <div class="keyboard">
                
            </div>
        </div>
    </div>
    
    <script src = 'words.js'></script>
</body>
</html>
